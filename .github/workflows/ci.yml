name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: olafurpg/setup-scala@v14
        with:
          java-version: temurin@17

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/Dependencies.scala', 'project/plugins.sbt') }}

      - name: Check formatting, compile, test, and verify docs
        run: sbt scalafmtCheckAll compile test docs/mdoc
